name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer master push queues behind a running deploy instead of cutting it
  # off partway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    env:
      ENGINE_HMAC_KEY_ID: web
      ENGINE_HMAC_SECRET: ci-build-engine-hmac-secret-7Kp4xQ9m2Vw8
      GOOGLE_CLIENT_ID: ci-build-client
      GOOGLE_CLIENT_SECRET: ci-build-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
      INTEGRATIONS_ENCRYPTION_KEY: ci-build-integrations-key-3Hv8qN5x2Rm7
      NOTIFICATION_ROUTES: ""
      SESSION_SECRET: ci-build-session-secret-4Nq8vR2m7Kx5
      TOTP_ENCRYPTION_KEY: ci-build-totp-encryption-key-9Wp3mK7xQ2v8
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-build-webhook-token-6Kr9mQ2xV7p4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: install dependencies
        run: mise run install

      - name: browser system libraries
        run: bun --cwd apps/web playwright install-deps chromium

      # History scanning needs the fetch-depth 0 checkout above. This runs in
      # CI rather than the check task because a local tree can be a filtered
      # or shallow clone.
      - name: secrets
        run: mise x gitleaks@8.30.1 -- gitleaks detect --no-banner --redact

      - name: check
        run: mise run check

  deploy:
    name: Deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # The environment admits only master. The Cloudflare token and account id
    # are risinghq org secrets, which reach the repo because it is public.
    environment:
      name: production
      url: https://work360.rising.sh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: install dependencies
        run: mise run install

      - name: build
        working-directory: apps/web
        run: bun run build:workers
        # With all three upload values set, the build uploads source maps to
        # Sentry and deletes the client maps before the assets deploy.
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: deploy
        working-directory: apps/web
        run: bunx wrangler deploy -c dist/worker/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
